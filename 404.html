<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="description" content="Señal perdida — la ruta solicitada no existe en el universo Belentani. Vuelve al portal, a la obra o al mapa galaxia.">
<title>Belentani — Señal perdida</title>
<style>
  :root{
    --void:#070504; --ink:#f4ece4; --mute:#a8988c; --blood:#c8102e; --gold:#b8953a;
    --display:"Bodoni Moda","Times New Roman",serif; --sans:"Syne",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(ellipse 60% 50% at 50% 30%, rgba(140,30,40,.22), transparent 60%),
      linear-gradient(180deg,#0b0706 0%,#120c0a 55%,#241610 100%);
    color:var(--ink); font-family:var(--sans);
    display:grid; place-items:center; padding:24px;
  }
  main{max-width:560px;text-align:center}
  .sig{font-family:var(--display);font-size:clamp(3rem,12vw,5.5rem);line-height:1;letter-spacing:.04em}
  .sig span{color:var(--blood);text-shadow:0 0 40px rgba(200,16,46,.8)}
  p{margin-top:18px;color:var(--mute);line-height:1.6}
  .links{margin-top:28px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  a{
    color:var(--ink);text-decoration:none;border:1px solid rgba(184,149,58,.5);
    padding:.6rem 1.1rem;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;
  }
  a:hover{border-color:var(--gold);color:var(--gold)}
  a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  small{display:block;margin-top:34px;color:#6a5f5c;font-size:.65rem;letter-spacing:.12em;text-transform:uppercase}
</style>
</head>
<body>
<main>
  <h1 class="sig">404 <span>·</span> SEÑAL PERDIDA</h1>
  <p>Esta ruta no forma parte del organismo. El archivo recuerda, pero no inventa coordenadas que no existen.</p>
  <div class="links">
    <a href="/">Volver al portal</a>
    <a href="/obra/">Ver la obra</a>
    <a href="/galaxia/">Mapa galaxia</a>
  </div>
  <small>Belentani — JUDAS_OS · el error también es material</small>
</main>
</body>
</html>
