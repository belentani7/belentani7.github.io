name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build public-only artifact
        run: node scripts/build-pages.mjs

      - name: Verify published site artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/editorial.css
          test -s _site/CNAME
          test "$(tr -d '\\r\\n' < _site/CNAME)" = "www.belentani.es"
          for page in ecosistema.html noiacore/index.html artista/index.html prensa/index.html; do
            test -s "_site/$page"
          done
          if find _site -type l | grep -q .; then
            echo "Unexpected symlink in published artifact" >&2
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
